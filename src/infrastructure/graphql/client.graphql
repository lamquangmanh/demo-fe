query Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    accessToken
    refreshToken
  }
}

query GetMe {
  getMe {
    userId
    username
    email
    status
    avatar
    phone
  }
}

query GetSuperMenus {
  getSuperMenus {
    superMenus {
      name
      description
      url
      icon
      menus {
        name
        url
        icon
        subMenus {
          name
          url
        }
      }
    }
  }
}

query Module($moduleId: String!) {
  module(moduleId: $moduleId) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    moduleId
    name
    description
  }
}

query GetModules(
  $pagination: PaginationArgs!
  $sorts: [SortArgs!]!
  $filters: [FilterArgs!]!
) {
  modules(pagination: $pagination, sorts: $sorts, filters: $filters) {
    data {
      createdAt
      createdUserId
      updatedAt
      updatedUserId
      deletedAt
      deletedUserId
      moduleId
      name
      description
    }

    pagination {
      page
      limit
      totalItems
      totalPages
      itemCount
    }
  }
}

mutation CreateModule($name: String!, $description: String) {
  createModule(name: $name, description: $description) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    moduleId
    name
    description
  }
}

mutation UpdateModule(
  $moduleId: String!
  $name: String!
  $description: String
) {
  updateModule(moduleId: $moduleId, name: $name, description: $description) {
    success
  }
}

mutation DeleteModule($moduleId: String!) {
  deleteModule(moduleId: $moduleId) {
    success
  }
}

query GetPermissionsByUser {
  getPermissionsByUser {
    permissions {
      name
      url
      method
      requestType
    }
  }
}

query Product($productId: String!) {
  product(productId: $productId) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    productId
    name
    url
    icon
    description
  }
}

query Products(
  $pagination: PaginationArgs!
  $sorts: [SortArgs!]!
  $filters: [FilterArgs!]!
) {
  products(pagination: $pagination, sorts: $sorts, filters: $filters) {
    pagination {
      page
      limit
      totalItems
      totalPages
      itemCount
    }
    data {
      createdAt
      createdUserId
      updatedAt
      updatedUserId
      deletedAt
      deletedUserId
      productId
      name
      url
      icon
      description
    }
  }
}

mutation CreateProduct(
  $name: String!
  $url: String!
  $description: String
  $icon: String
) {
  createProduct(
    name: $name
    url: $url
    description: $description
    icon: $icon
  ) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    productId
    name
    url
    icon
    description
  }
}

mutation UpdateProduct(
  $name: String!
  $url: String!
  $productId: String!
  $description: String
  $icon: String
) {
  updateProduct(
    name: $name
    url: $url
    productId: $productId
    description: $description
    icon: $icon
  ) {
    success
  }
}

mutation DeleteProduct($productId: String!) {
  deleteProduct(productId: $productId) {
    success
  }
}
