query User($userId: String!) {
  user(userId: $userId) {
    userId
    username
    email
    password
    phone
    avatar
    status
    userRoles {
      roleId
      role {
        name
      }
      userId
      userRoleId
    }
  }
}

mutation CreateUser(
  $username: String!
  $email: String!
  $password: String!
  $status: String!
  $roleIds: [String!]!
  $phone: String
  $avatar: String
) {
  createUser(
    username: $username
    email: $email
    password: $password
    status: $status
    roleIds: $roleIds
    phone: $phone
    avatar: $avatar
  ) {
    userId
    username
    email
    password
    phone
    avatar
    status
    userRoles {
      roleId
      userId
      userRoleId
    }
  }
}

