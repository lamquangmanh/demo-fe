query Login($email: String!, $password: String!) {
  login(email: $email, password: $password) {
    accessToken
    refreshToken
    success
  }
}

query GetMe {
  getMe {
    userId
    username
    email
    status
    avatar
    phone
  }
}

query GetSuperMenus {
  getSuperMenus {
    superMenus {
      name
      description
      url
      icon
      menus {
        name
        url
        icon
        subMenus {
          name
          url
        }
      }
    }
  }
}

query Module($moduleId: String!) {
  module(moduleId: $moduleId) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    moduleId
    productId
    name
    description
    icon
    url
    product {
      productId
      name
    }
  }
}

query GetModules(
  $pagination: PaginationArgs!
  $sorts: [SortArgs!]!
  $filters: [FilterArgs!]!
) {
  modules(pagination: $pagination, sorts: $sorts, filters: $filters) {
    data {
      createdAt
      createdUserId
      updatedAt
      updatedUserId
      deletedAt
      deletedUserId
      moduleId
      productId
      product {
        name
      }
      name
      description
      icon
      url
      createdUser {
        username
        email
      }
      updatedUser {
        username
        email
      }
      deletedUser {
        username
        email
      }
    }

    pagination {
      page
      limit
      totalItems
      totalPages
      itemCount
    }
  }
}

mutation CreateModule(
  $name: String!
  $description: String
  $productId: String!
  $icon: String
  $url: String
) {
  createModule(
    name: $name
    description: $description
    productId: $productId
    icon: $icon
    url: $url
  ) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    moduleId
    productId
    name
    description
    icon
    url
  }
}

mutation UpdateModule(
  $moduleId: String!
  $productId: String!
  $name: String!
  $description: String
  $icon: String
  $url: String
) {
  updateModule(
    moduleId: $moduleId
    productId: $productId
    name: $name
    description: $description
    icon: $icon
    url: $url
  ) {
    success
  }
}

mutation DeleteModule($moduleId: String!) {
  deleteModule(moduleId: $moduleId) {
    success
  }
}

query GetPermissionsByUser {
  getPermissionsByUser {
    permissions {
      name
      url
      method
      requestType
    }
  }
}

query Product($productId: String!) {
  product(productId: $productId) {
    createdAt
    createdUserId
    updatedAt
    updatedUserId
    deletedAt
    deletedUserId
    productId
    name
    url
    icon
    description
  }
}

