query Resource($resourceId: String!) {
  resource(resourceId: $resourceId) {
    resourceId
    name
    moduleId
    module {
      moduleId
      name
    }
    actions {
      actionId
      name
      description
      method
      url
      requestType
    }
  }
}

mutation CreateResource(
  $name: String!
  $moduleId: String!
  $actions: [ActionInput!]!
) {
  createResource(name: $name, moduleId: $moduleId, actions: $actions) {
    moduleId
    resourceId
    name
  }
}

mutation UpdateResource(
  $name: String!
